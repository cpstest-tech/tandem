_version: 2

sync.menu:
  en: "Sync by audio"
  it: "Sincronizza con l'audio"
sync.pick_two:
  en: "Select two or more clips (or linked groups) that recorded the same sound."
  it: "Seleziona due o più clip (o gruppi collegati) che hanno registrato lo stesso suono."
sync.no_audio:
  en: "Both clips need audio to sync."
  it: "Entrambi i clip devono avere l'audio per sincronizzarli."
sync.working:
  en: "Matching the audio…"
  it: "Confronto l'audio…"
sync.no_match:
  en: "The two recordings do not seem to match."
  it: "Le due registrazioni non sembrano corrispondere."
sync.done_count:
  en: "Synced %{count} clips (%{failed} without a match). Keys 1–9 switch angle at the playhead."
  it: "Sincronizzati %{count} clip (%{failed} senza corrispondenza). I tasti 1–9 cambiano angolazione alla testina."
